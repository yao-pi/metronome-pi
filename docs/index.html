<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6750A4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141218" media="(prefers-color-scheme: dark)">
<meta name="description" content="Tap-tempo metronome with Pi tipping.">
<title>Tap Tempo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Flex:opsz,wght@8..144,400;8..144,500&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top-app-bar">
  <h1 class="top-app-bar__title">Tap Tempo</h1>
  <span class="badge" id="env-badge" hidden></span>
</header>

<main class="pane">

  <!-- BPM readout -->
  <section class="card card--readout" aria-labelledby="bpm-label">
    <div class="readout">
      <output class="readout__value" id="bpm-value" aria-live="polite" aria-atomic="true">--</output>
      <span class="readout__unit" id="bpm-label">BPM</span>
    </div>
    <p class="readout__marking" id="tempo-marking">Tap the button to begin</p>
    <div class="beat-track" id="beat-track" aria-hidden="true">
      <span class="beat-dot"></span><span class="beat-dot"></span>
      <span class="beat-dot"></span><span class="beat-dot"></span>
    </div>
  </section>

  <!-- Tap target -->
  <div class="tap-zone">
    <button class="tap-button" id="tap-button" type="button" aria-describedby="tap-hint">
      <span class="tap-button__state"></span>
      <span class="tap-button__ring" aria-hidden="true"></span>
      <span class="tap-button__label">TAP</span>
    </button>
  </div>
  <p class="hint" id="tap-hint">Tap in time with the music &middot; pause 2s to reset</p>

  <div class="actions">
    <button class="btn btn--text" id="reset-button" type="button">
      <span class="btn__state"></span>
      <span class="icon" aria-hidden="true">refresh</span>
      <span>Reset</span>
    </button>
  </div>

  <!-- Tip -->
  <section class="card card--tip">
    <div class="tip__head">
      <span class="tip__icon" aria-hidden="true">&#960;</span>
      <div class="tip__copy">
        <h2 class="tip__title">Enjoying this?</h2>
        <p class="tip__body">Send the creator a small thank-you in Pi.</p>
      </div>
    </div>
    <button class="btn btn--filled btn--tip" id="tip-button" type="button">
      <span class="btn__state"></span>
      <span class="btn__spinner" aria-hidden="true"></span>
      <span class="btn__text">Tip 0.1 &#960;</span>
    </button>
    <p class="tip__status" id="tip-status" role="status"></p>
  </section>

</main>

<div class="snackbar" id="snackbar" role="status" aria-live="polite">
  <span class="snackbar__text" id="snackbar-text"></span>
</div>

<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
